version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huurgo-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?Set a strong JWT_SECRET before starting production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-onboarding@resend.dev}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-info@huurgo.nl}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      # Persistent volume for uploads so user-uploaded files are retained
      - ./uploads:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: huurgo-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app


