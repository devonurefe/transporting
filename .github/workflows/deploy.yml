name: Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Kwaliteitspoort: build/deploy draaien pas na groene lint + tests
  test:
    runs-on: ubuntu-latest
    # PostgreSQL-service voor de API-integratietests (unit-tests draaien ook
    # zonder DB; de integratietests slaan over als DATABASE_URL ontbreekt).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: huurgo
          POSTGRES_PASSWORD: huurgo_ci_pass
          POSTGRES_DB: huurgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U huurgo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://huurgo:huurgo_ci_pass@localhost:5432/huurgo_test
      JWT_SECRET: ci-integration-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to test database
        run: npx prisma db push --skip-generate

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm run test

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/devonurefe/transporting:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to VPS
        run: |
          sudo apt-get install -y sshpass -q
          success=0
          for attempt in 1 2 3; do
            echo "Deneme $attempt..."
            if sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              root@${{ secrets.VPS_HOST }} \
              "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
               cd /opt/huurgo && \
               git pull origin main && \
               docker compose pull app && \
               docker compose up -d --force-recreate --no-deps app && \
               docker compose exec -T nginx nginx -s reload && \
               echo 'Deploy tamamlandi:' \$(date)"; then
              echo "Basarili!"
              success=1
              break
            fi
            echo "15 saniye bekleniyor..."
            sleep 15
          done
          if [ "$success" -ne 1 ]; then
            echo "::error::Deploy 3 denemeden sonra basarisiz oldu"
            exit 1
          fi
