version: "3.8"

# Caps each container's log file (json-file driver, docker's default) at
# 10MB x 3 files. Without this, container logs accumulate unbounded on disk
# forever — harmless for a while, but a slow leak that eventually competes
# with everything else for the VPS's disk space.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: huurgo-db
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: huurgo
      POSTGRES_USER: huurgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD before starting production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huurgo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/devonurefe/transporting:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huurgo-app
    restart: always
    logging: *default-logging
    # Makes `docker compose ps` report whether the app is actually serving, not
    # merely that the process exists — the two diverge exactly in the case that
    # is hardest to notice remotely (process alive, requests wedged). Note this
    # is diagnostic only: Docker does not restart on an unhealthy status, so the
    # cron watchdog (scripts/watchdog.sh) remains what actually recovers it.
    # Uses node rather than curl/wget so it can't depend on what the base image
    # happens to ship.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?Set a strong JWT_SECRET before starting production}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-onboarding@resend.dev}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-info@huurgo.nl}
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL to match POSTGRES_PASSWORD before starting production}
      - APP_URL=${APP_URL:-https://huurgo.nl}
      - REMINDER_SECRET=${REMINDER_SECRET}
      - CALENDAR_FEED_TOKEN=${CALENDAR_FEED_TOKEN}
      - MOLLIE_API_KEY=${MOLLIE_API_KEY}
    volumes:
      # The app container runs as the non-root "node" user (uid 1000). Run
      # `chown -R 1000:1000 uploads` on the host once before first start,
      # otherwise uploads will fail with EACCES.
      - ./uploads:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: huurgo-proxy
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: huurgo-certbot
    logging: *default-logging
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:


