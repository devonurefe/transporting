services:
  - type: web
    name: huurgo
    runtime: node
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VITE_WHATSAPP_NUMBER
        sync: false
      - key: APP_URL
        sync: false
      - key: REMINDER_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
