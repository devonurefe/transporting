user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Matches the 10mb JSON body limit Express allows on /api/upload,
    # /api/machines and /api/site-config for base64 image payloads.
    client_max_body_size 10m;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    upstream app_servers {
        server app:3000;
    }

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name localhost huurgo.nl www.huurgo.nl;

        # Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Canonical host: www.huurgo.nl 301-redirects to the apex domain so Google
    # (and every other crawler/link) consolidates on a single indexable host —
    # matches SEO_BASE_URL/canonical tags in server.ts, which are all apex-only.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.huurgo.nl;

        ssl_certificate /etc/letsencrypt/live/huurgo.nl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/huurgo.nl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://huurgo.nl$request_uri;
    }

    # HTTPS Server Configuration
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost huurgo.nl;

        # SSL Certificates boilerplate (mount Let's Encrypt path in volume)
        ssl_certificate /etc/letsencrypt/live/huurgo.nl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/huurgo.nl/privkey.pem;

        # Optimized SSL Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        # KEEP IN SYNC with the Helmet CSP in server.ts. nginx's `add_header ...
        # always` sends this on every response regardless of what the upstream
        # Node app already set, and with two CSP headers present browsers enforce
        # the strictest value per directive — so a directive left stricter here
        # silently overrides whatever the app allows, no matter what server.ts says.
        # worker-src: the datasheet PDF viewer renders pages via pdf.js, whose
        # worker Vite emits as a same-origin /assets bundle.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self'; object-src 'none';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        location / {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
