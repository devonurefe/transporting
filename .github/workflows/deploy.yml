name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/devonurefe/transporting:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        run: |
          sudo apt-get install -y sshpass -q
          for attempt in 1 2 3; do
            echo "Deneme $attempt..."
            if sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              root@${{ secrets.VPS_HOST }} \
              "docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} --password-stdin <<< '${{ secrets.GITHUB_TOKEN }}' 2>/dev/null; \
               cd /opt/huurgo && \
               docker compose pull app && \
               docker compose up -d && \
               docker compose exec -T app npx prisma db push && \
               echo 'Deploy tamamlandi:' \$(date)"; then
              echo "Basarili!"
              break
            fi
            echo "15 saniye bekleniyor..."
            sleep 15
          done
