name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to VPS
        run: |
          sudo apt-get install -y sshpass -q
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            root@${{ secrets.VPS_HOST }} \
            'cd /opt/huurgo && git pull origin main && docker compose up -d --build && docker compose exec -T app npx prisma db push && echo "Deploy tamamlandi: $(date)"'
