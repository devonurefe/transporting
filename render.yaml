services:
  - type: web
    name: huurgo
    runtime: node
    buildCommand: npm install && npm run build && node scripts/preparePush.mjs && npx prisma db push
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VITE_WHATSAPP_NUMBER
        sync: false
      - key: APP_URL
        sync: false
      - key: REMINDER_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Only used on the very first deploy (empty DB) to seed the admin account
      # (admin@huurgo.nl). If left unset a random password is printed to the
      # deploy logs. Change it via the admin panel after first login.
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
