version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: huurgo-db
    restart: always
    environment:
      POSTGRES_DB: huurgo
      POSTGRES_USER: huurgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huurgo_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huurgo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huurgo-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?Set a strong JWT_SECRET before starting production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-onboarding@resend.dev}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-info@huurgo.nl}
      - DATABASE_URL=${DATABASE_URL:-postgresql://huurgo:huurgo_dev_pass@postgres:5432/huurgo}
    volumes:
      - ./uploads:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: huurgo-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app

volumes:
  postgres_data:


