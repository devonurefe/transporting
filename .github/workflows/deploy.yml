name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        run: |
          sudo apt-get install -y sshpass -q
          for attempt in 1 2 3; do
            echo "Deneme $attempt..."
            if sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              root@${{ secrets.VPS_HOST }} \
              'nohup bash -c "cd /opt/huurgo && git pull origin main && docker compose up -d --build && docker compose exec -T app npx prisma db push" > /tmp/deploy.log 2>&1 & echo "Deploy baslatildi: PID=$!"'; then
              echo "Basarili!"
              break
            fi
            echo "Baglanti kurulamadi, 15 saniye bekleniyor..."
            sleep 15
          done
